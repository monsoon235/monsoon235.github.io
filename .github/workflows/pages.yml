name: Pages

on:
  push:
    branches:
      - main
      - next
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: "0.163.1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive   # pull the PaperMod theme
          fetch-depth: 0          # full history (for git-based lastmod, if enabled)
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true
      - name: Build
        run: hugo --gc --minify
      # Deploy only from main; pushes to `next` run a build-only CI check.
      - name: Deploy
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
